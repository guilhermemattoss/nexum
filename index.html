<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexum</title>

  <link rel="stylesheet" href="style.css" />

  <!-- IMPORTANTE: SEU SCRIPT PRINCIPAL -->
  <script type="module" src="script.js" defer></script>
</head>

<body>

  <header>
    <div class="logo">🌐 Nexum</div>
    <button id="toggle-tema">🌓</button>
  </header>

  <main>

    <!-- LOGIN / CADASTRO -->
    <section id="auth">
      <h2>Entrar / Criar conta</h2>

      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Senha">

      <button id="btnLogin">Login</button>
      <button id="btnSignup">Cadastrar</button>
    </section>

    <!-- APP -->
    <section id="app" style="display:none;">

      <h1>Como você está se sentindo?</h1>

      <!-- POST -->
      <textarea id="postInput" placeholder="O que você está sentindo?"></textarea>

      <!-- UPLOAD DE IMAGEM -->
      <input type="file" id="imageInput" accept="image/*">

      <button id="btnPostar" type="button">Postar</button>

      <!-- FEED -->
      <div id="feed"></div>

      <!-- HUMOR -->
      <div class="moods">
        <button class="mood" data-mood="feliz">😄 Feliz</button>
        <button class="mood" data-mood="triste">😢 Triste</button>
        <button class="mood" data-mood="calmo">🧘‍♂️ Calmo</button>
        <button class="mood" data-mood="irritado">🤬 Irritado</button>
        <button class="mood" data-mood="cansado">😴 Cansado</button>
        <button class="mood" data-mood="apaixonado">😍 Apaixonado</button>
      </div>

      <!-- MENSAGEM -->
      <div id="mensagem"></div>

    </section>

  </main>

</body>
</html>
